<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Urukundo 🇧🇮 - Dating Burundais</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ce1126" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Urukundo" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
      html { height: 100%; background: white; }
      body {
        font-family: 'Inter', sans-serif;
        height: 100%;
        background: white;
        overscroll-behavior: none;
        overflow: hidden;
        position: fixed;
        width: 100%;
        top: 0;
        left: 0;
      }
      #root { height: 100%; background: white; }

      /* Thèmes — on re-teinte les classes Tailwind existantes plutôt que de
         toucher chaque composant, puisque Tailwind est chargé en CDN (pas de build). */
      html[data-theme="soft"] body,
      html[data-theme="soft"] #root { background: #fdf8f0; }
      html[data-theme="soft"] .bg-white { background-color: #fdf8f0 !important; }
      html[data-theme="soft"] .bg-gray-50 { background-color: #f7ede0 !important; }
      html[data-theme="soft"] .bg-gray-50\/50 { background-color: rgba(247,237,224,0.5) !important; }
      html[data-theme="soft"] .bg-gray-100 { background-color: #f0e3d0 !important; }
      html[data-theme="soft"] .bg-gray-200 { background-color: #e8d7bd !important; }
      html[data-theme="soft"] .bg-gray-300 { background-color: #ddc9a8 !important; }
      html[data-theme="soft"] .border-gray-100 { border-color: #ead9c0 !important; }
      html[data-theme="soft"] .border-gray-200 { border-color: #e0c9a5 !important; }
      html[data-theme="soft"] .text-gray-800 { color: #4a3f35 !important; }
      html[data-theme="soft"] .text-gray-700 { color: #5a4d40 !important; }
      html[data-theme="soft"] .text-gray-600 { color: #6b5d4e !important; }
      html[data-theme="soft"] .text-gray-500 { color: #8a7a68 !important; }
      html[data-theme="soft"] .text-gray-400 { color: #a89881 !important; }
      html[data-theme="soft"] .text-gray-300 { color: #c4b49c !important; }

      html[data-theme="dark"] body,
      html[data-theme="dark"] #root { background: #151516; }
      html[data-theme="dark"] .bg-white { background-color: #1c1c1e !important; }
      html[data-theme="dark"] .bg-gray-50 { background-color: #151516 !important; }
      html[data-theme="dark"] .bg-gray-50\/50 { background-color: rgba(21,21,22,0.5) !important; }
      html[data-theme="dark"] .bg-gray-100 { background-color: #2a2a2c !important; }
      html[data-theme="dark"] .bg-gray-200 { background-color: #343436 !important; }
      html[data-theme="dark"] .bg-gray-300 { background-color: #46464a !important; }
      html[data-theme="dark"] .border-gray-100 { border-color: #2e2e30 !important; }
      html[data-theme="dark"] .border-gray-200 { border-color: #3a3a3c !important; }
      html[data-theme="dark"] .text-gray-800 { color: #f2f2f3 !important; }
      html[data-theme="dark"] .text-gray-700 { color: #e2e2e4 !important; }
      html[data-theme="dark"] .text-gray-600 { color: #c7c7ca !important; }
      html[data-theme="dark"] .text-gray-500 { color: #a3a3a8 !important; }
      html[data-theme="dark"] .text-gray-400 { color: #8b8b90 !important; }
      html[data-theme="dark"] .text-gray-300 { color: #6f6f74 !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
    <script>
      // Désinscrire les anciens service workers (cause du bug d'écran blanc),
      // mais garder celui des notifications push (firebase-messaging-sw.js).
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(regs => {
          regs.forEach(reg => {
            const url = reg.active?.scriptURL || reg.installing?.scriptURL || reg.waiting?.scriptURL || '';
            if (!url.includes('firebase-messaging-sw.js')) {
              reg.unregister();
              console.log('SW unregistered:', url);
            }
          });
        });
      }
    </script>
  </body>
</html>
